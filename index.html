</style><body><aside><div class="brand">networkee<span>·</span></div><div class="sub" style="color:#98b9ae">Dein Kundenalltag, sortiert.</div><nav id="nav"></nav><small>DEIN ARBEITSPLATZ<br><b style="color:white">Solo Business</b><br>Interaktiver Prototyp · V1</small></aside><main><header><div class="brand"><img src="networkee-icon.png" alt="Networkee Glühlampe">networkee<span>·</span></div><input id="search" placeholder="Kontakte suchen …" aria-label="Kontakte suchen"><div><span class="badge">Demo · lokal gespeichert</span></div></header><div id="view"></div><p class="banner">Dein privater Testbereich: Beispieldaten und Änderungen bleiben in diesem Browser. Keine Cloud-Synchronisierung, keine echte KI-Verarbeitung.</p></main><nav class="bottomnav" id="bottomnav" aria-label="Hauptnavigation"></nav><div id="modal"></div><div id="toast" hidden></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0');const seed={contacts:[{id:'a',name:'Anna Keller',company:'Studio Keller',email:'anna@example.com',notes:[{text:'Plant einen neuen Webauftritt. Wichtig sind eine einfache Pflege und eine klare Darstellung ihrer Leistungen.',date:today}]},{id:'b',name:'Markus Weber',company:'Weber Beratung',email:'markus@example.com',notes:[{text:'Interesse an einer Zusammenarbeit für sein nächstes Kundenprojekt. Umfang und Zeitplan sind noch offen.',date:today}]},{id:'c',name:'Sophie Baumann',company:'Baumann Interior',email:'sophie@example.com',notes:[{text:'Angebot erhalten. Möchte die Umsetzung im nächsten Gespräch besprechen.',date:today}]}],tasks:[{id:'t1',contact:'c',title:'Zum Website-Angebot nachfassen',date:today,done:false},{id:'t2',contact:'b',title:'Termin für Projektgespräch vereinbaren',date:today,done:false}],deals:[{id:'d1',contact:'a',title:'Neuer Webauftritt',amount:2800,status:'Anfrage'},{id:'d2',contact:'c',title:'Website & Beratung',amount:4200,status:'Angebot offen'},{id:'d3',contact:'b',title:'Strategie-Workshop',amount:1500,status:'Gewonnen'}]};let db;try{db=JSON.parse(localStorage.getItem('networkee-v1'))||structuredClone(seed)}catch{db=structuredClone(seed)}let page='Heute',search='';const uid=()=>crypto.randomUUID(),person=id=>db.contacts.find(c=>c.id===id),money=n=>new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF',maximumFractionDigits:0}).format(n),save=()=>{try{localStorage.setItem('networkee-v1',JSON.stringify(db))}catch{toast('Speicherung nicht möglich. Browser-Speicher prüfen.')}render()},toast=t=>{$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3200)},close=()=>{if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(t=>t.stop());$('#modal').innerHTML=''},modal=(html,wide=false)=>{$('#modal').innerHTML=`<div class="modal"><div role="dialog" aria-modal="true" aria-label="Networkee Dialog" class="dialog ${wide?'wide':''}"><button class="close" onclick="close()" aria-label="Schliessen">✕</button>${html}</div></div>`;$('#modal input, #modal textarea, #modal select')?.focus()},initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join(''),contactOptions=id=>db.contacts.map(c=>`<option value="${c.id}" ${id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');function go(p){page=p;search='';$('#search').value='';render()}function taskRow(t){let c=person(t.contact);return `<div class="row"><div class="person"><button aria-label="Aufgabe abschliessen" onclick="done('${t.id}')">${t.done?'✓':'○'}</button><div><h3>${esc(t.title)}</h3><div class="sub">${esc(c?.name)} · ${esc(t.date)} ${t.date<today&&!t.done?'· Überfällig':''}</div></div></div><button onclick="detail('${t.contact}')">Kontakt</button></div>`}function done(id){db.tasks.find(t=>t.id===id).done=!db.tasks.find(t=>t.id===id).done;save();toast('Aufgabe aktualisiert')}function render(){ $('#nav').innerHTML=['Heute','Kontakte','Geschäftschancen','Aufgaben','Einstellungen'].map((p,i)=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${['◷','▦','◇','☑','⚙'][i]} &nbsp;${p}</button>`).join('');let due=db.tasks.filter(t=>!t.done&&t.date<=today),open=db.deals.filter(d=>d.status!=='Gewonnen');let html='';if(page==='Heute')html=`<div class="top"><div><div class="eyebrow">${new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Gute Beziehungen. Klarer Kopf.</h1><p class="muted">Dein nächster Schritt ist schon im Blick.</p></div><button class="primary" onclick="capture()">＋ Gespräch festhalten</button></div><div class="stats"><div class="stat"><small>Jetzt nachfassen</small><strong>${due.length}</strong><small>fällige Aufgaben</small></div><div class="stat"><small>Offenes Potenzial</small><strong>${money(open.reduce((a,d)=>a+d.amount,0))}</strong><small>${open.length} Geschäftschancen</small></div><div class="stat"><small>Dein Netzwerk</small><strong>${db.contacts.length}</strong><small>Kunden & Kontakte</small></div></div><div class="grid"><div><section class="card"><div class="top" style="margin-bottom:0"><h2>Das steht heute an</h2><button onclick="go('Aufgaben')">Alle Aufgaben</button></div>${due.map(taskRow).join('')||'<p class="empty">Alles erledigt. Heute ist nichts mehr fällig.</p>'}</section><section class="card"><h2>Offene Geschäftschancen</h2>${open.map(d=>`<div class="row"><div><h3>${esc(d.title)}</h3><div class="sub">${esc(person(d.contact)?.name)} · ${esc(d.status)}</div></div><b>${money(d.amount)}</b></div>`).join('')||'<p>Keine offenen Geschäftschancen.</p>'}<button onclick="dealForm()">＋ Geschäftschance</button></section></div><div><section class="card hero"><div class="eyebrow">DEIN ASSISTENT</div><h2 style="margin-top:12px">Gespräch beendet.<br>Kopf wieder frei.</h2><p>Halte kurz fest, was besprochen wurde. Prüfe die Notiz und lege den nächsten Schritt fest.</p><button class="primary" onclick="capture()">Notiz vorbereiten</button><div class="sub" style="margin-top:15px">Text & Audioaufnahme · KI-Demo</div></section><section class="card"><h2>Vorbereitet ins Gespräch</h2><p class="muted">Alle Notizen und offenen Zusagen an einem Ort.</p>${db.contacts.slice(0,3).map(c=>`<div class="row click" onclick="detail('${c.id}')"><div class="person"><div class="avatar">${esc(initials(c.name))}</div><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.company)}</div></div></div><span>↗</span></div>`).join('')}</section></div></div>`;
if(page==='Kontakte')html=`<div class="top"><div><div class="eyebrow">Beziehungen mit Kontext</div><h1>Deine Kontakte</h1><p class="muted">Wissen, was zählt. Erinnern, was vereinbart wurde.</p></div><button class="primary" onclick="contactForm()">＋ Kontakt</button></div><div class="listgrid">${db.contacts.filter(c=>(c.name+' '+c.company).toLowerCase().includes(search.toLowerCase())).map(c=>`<button class="card click" style="text-align:left" onclick="detail('${c.id}')"><div class="avatar">${esc(initials(c.name))}</div><h2 style="margin-top:18px;margin-bottom:4px">${esc(c.name)}</h2><div class="muted">${esc(c.company)}</div><div class="sub" style="margin-top:20px">${c.notes.length} Notizen · ${db.tasks.filter(t=>t.contact===c.id&&!t.done).length} offene Aufgaben</div></button>`).join('')||'<p class="empty">Keine Kontakte gefunden. Lege deinen ersten Kontakt an.</p>'}</div>`;
if(page==='Geschäftschancen')html=`<div class="top"><div><div class="eyebrow">Vom Gespräch zum Auftrag</div><h1>Deine Geschäftschancen</h1><p class="muted">Ein klarer Überblick über das, was entstehen kann.</p></div><button class="primary" onclick="dealForm()">＋ Geschäftschance</button></div><div class="board">${['Anfrage','Angebot offen','Gewonnen'].map(s=>`<section class="column"><h3>${s} <span class="tag">${db.deals.filter(d=>d.status===s).length}</span></h3>${db.deals.filter(d=>d.status===s).map(d=>`<article class="card"><div class="sub">${esc(person(d.contact)?.name)}</div><h3>${esc(d.title)}</h3><div class="money">${money(d.amount)}</div><select aria-label="Status ändern" onchange="db.deals.find(d=>d.id==='${d.id}').status=this.value;save()">${['Anfrage','Angebot offen','Gewonnen'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select><button style="margin-top:10px" onclick="dealForm('${d.id}')">Bearbeiten</button></article>`).join('')||'<p class="empty">Hier ist noch Platz für Neues.</p>'}</section>`).join('')}</div>`;
if(page==='Aufgaben')html=`<div class="top"><div><div class="eyebrow">Zuverlässig dranbleiben</div><h1>Deine nächsten Schritte</h1><p class="muted">Erinnerungen erscheinen hier. Ein E-Mail-Versand ist noch nicht eingerichtet.</p></div><button class="primary" onclick="taskForm()">＋ Aufgabe</button></div><section class="card"><h2>Offen</h2>${db.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)).map(taskRow).join('')||'<p class="empty">Keine offenen Aufgaben.</p>'}</section><details class="card"><summary>Erledigt (${db.tasks.filter(t=>t.done).length})</summary>${db.tasks.filter(t=>t.done).map(taskRow).join('')}</details>`;
if(page==='Einstellungen')html=`<h1>Dein Testbereich</h1><p class="muted">Ein erster Eindruck mit echten Interaktionen.</p><section class="card"><h2>Was diese Version kann</h2><p>Kontakte, Notizen, Aufgaben und Geschäftschancen werden lokal in diesem Browser gespeichert. Audio lässt sich aufnehmen und herunterladen. Es gibt noch keine Registrierung, Transkription, KI-Anbindung oder Abrechnung.</p><p>Nutze zum Testen bitte Beispieldaten. Browserdaten können gelöscht werden; sichere deine Eingaben über den Export.</p><div class="actions"><button onclick="exportData()">Daten als JSON exportieren</button><button onclick="if(confirm('Alle lokalen Eingaben durch Beispieldaten ersetzen?')){db=structuredClone(seed);save()}">Demo zurücksetzen</button></div></section>`;$('#view').innerHTML=html}$('#search').oninput=e=>{search=e.target.value;page='Kontakte';render()};
function contactForm(id){let c=person(id)||{};modal(`<h2>${id?'Kontakt bearbeiten':'Neuer Kontakt'}</h2><form id="cf"><label>Name</label><input name="name" required value="${esc(c.name||'')}" maxlength="120"><label>Unternehmen</label><input name="company" value="${esc(c.company||'')}"><label>E-Mail</label><input name="email" type="email" value="${esc(c.email||'')}"><div class="actions"><button class="primary">Speichern</button><button type="button" onclick="close()">Abbrechen</button></div></form>`);$('#cf').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!f.name.trim())return;if(id)Object.assign(c,f);else db.contacts.push({...f,id:uid(),notes:[]});close();save();toast('Kontakt gespeichert')}}
function detail(id){let c=person(id);if(!c)return;modal(`<div class="eyebrow">KONTAKTBRIEFING</div><h1>${esc(c.name)}</h1><p class="muted">${esc(c.company)} · ${esc(c.email)}</p><div class="actions"><button class="primary" onclick="capture('${id}')">Gespräch festhalten</button><button onclick="contactForm('${id}')">Bearbeiten</button></div><h2 style="margin-top:27px">Offene Zusagen</h2>${db.tasks.filter(t=>t.contact===id&&!t.done).map(t=>`<p>○ ${esc(t.title)} <span class="sub">${esc(t.date)}</span></p>`).join('')||'<p class="muted">Keine offenen Aufgaben.</p>'}<h2 style="margin-top:25px">Gesprächshistorie</h2>${c.notes.slice().reverse().map(n=>`<div class="note"><div class="sub">${esc(n.date)}</div><p>${esc(n.text)}</p></div>`).join('')||'<p>Noch keine Notizen.</p>'}`,true)}
function taskForm(){if(!db.contacts.length)return contactForm();modal(`<h2>Neuer nächster Schritt</h2><form id="tf"><label>Kontakt</label><select name="contact">${contactOptions()}</select><label>Aufgabe</label><input name="title" required maxlength="200"><label>Fällig am</label><input name="date" type="date" value="${today}" required><div class="actions"><button class="primary">Aufgabe speichern</button></div></form>`);$('#tf').onsubmit=e=>{e.preventDefault();db.tasks.push({...Object.fromEntries(new FormData(e.target)),id:uid(),done:false});close();save()}}
function dealForm(id){if(!db.contacts.length)return contactForm();let d=db.deals.find(x=>x.id===id)||{};modal(`<h2>${id?'Geschäftschance bearbeiten':'Neue Geschäftschance'}</h2><form id="df"><label>Kontakt</label><select name="contact">${contactOptions(d.contact)}</select><label>Projekt / Leistung</label><input name="title" required value="${esc(d.title||'')}"><label>Wert in CHF</label><input name="amount" type="number" min="0" step="1" required value="${d.amount||0}"><label>Status</label><select name="status">${['Anfrage','Angebot offen','Gewonnen'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="actions"><button class="primary">Speichern</button></div></form>`);$('#df').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.amount=Number(v.amount);if(id)Object.assign(d,v);else db.deals.push({...v,id:uid()});close();save()}}
let recorder,stream,audioURL;function capture(id){if(!db.contacts.length)return contactForm();modal(`<div class="eyebrow">DEIN GESPRÄCHSASSISTENT</div><h1>Was wurde besprochen?</h1><p class="muted">Halte das Wesentliche fest. Du entscheidest, was gespeichert wird.</p><label>Kontakt</label><select id="nc">${contactOptions(id)}</select><label>Gesprächsnotiz</label><textarea id="nt" placeholder="Was ist wichtig? Was hast du zugesagt? Was ist der nächste Schritt?"></textarea><div class="actions"><button id="record" onclick="recordAudio()">● Audio aufnehmen</button><button onclick="$('#nt').value='Interesse an einer neuen Website. Ein Angebot soll vorbereitet werden. Budget und Zeitplan sind noch offen.'">Beispiel einsetzen</button></div><div id="audio"></div><p class="sub" id="recStatus">Audio bleibt lokal. Automatische Transkription ist in dieser Version noch nicht angebunden.</p><details><summary>Wie funktioniert der Assistent hier?</summary><p class="sub">Die Vorschau übernimmt deinen Text unverändert und bietet einen allgemeinen nächsten Schritt. Es findet keine KI-Analyse statt.</p></details><div class="actions"><button class="primary" onclick="review()">Notiz prüfen & nächsten Schritt festlegen</button></div>`,true)}async function recordAudio(){if(recorder?.state==='recording'){recorder.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));if($('#audio'))$('#audio').innerHTML=`<audio controls src="${audioURL}"></audio><a download="networkee-gespraech.${recorder.mimeType.includes('mp4')?'mp4':'webm'}" href="${audioURL}">Aufnahme herunterladen</a>`;if($('#record'))$('#record').textContent='● Neue Aufnahme';if($('#recStatus'))$('#recStatus').textContent='Aufnahme fertig. Lade sie vor dem Schliessen herunter. Für die Notiz trägst du den Inhalt als Text ein.'};recorder.start();$('#record').textContent='■ Aufnahme stoppen';$('#recStatus').textContent='Aufnahme läuft … maximal 2 Minuten.';setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},120000)}catch{toast('Mikrofon nicht verfügbar oder Zugriff abgelehnt. Nutze die Texteingabe.')}}
function review(){let text=$('#nt').value.trim(),id=$('#nc').value;if(!text)return toast('Bitte zuerst eine Gesprächsnotiz eingeben.');if(recorder?.state==='recording')return toast('Bitte zuerst die Aufnahme stoppen.');modal(`<div class="eyebrow">PRÜFEN & BESTÄTIGEN</div><h1>So bleibt nichts offen.</h1><p class="muted">Notiz für ${esc(person(id).name)}. Alle Angaben sind bearbeitbar.</p><form id="nf"><label>Gesprächsnotiz</label><textarea name="text" required>${esc(text)}</textarea><label>Nächster Schritt (optional)</label><input name="task" placeholder="z. B. Angebot für Website vorbereiten"><label>Fällig am</label><input name="date" type="date" value="${today}"><p class="sub">Ein Datum wird nur zusammen mit einer Aufgabe gespeichert.</p><div class="actions"><button class="primary">Bestätigen & speichern</button><button type="button" onclick="close()">Verwerfen</button></div></form>`,true);$('#nf').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.task.trim()&&!v.date)return toast('Bitte ein Fälligkeitsdatum wählen.');person(id).notes.push({text:v.text,date:today});if(v.task.trim())db.tasks.push({id:uid(),contact:id,title:v.task,date:v.date,done:false});close();save();toast('Gespräch gespeichert. Dein nächster Schritt ist im Blick.')}}
function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='networkee-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

const themes={Blau:['#2563af','#eaf1fb','#153d70'],Grün:['#176b59','#e4f1eb','#124e42'],Schwarz:['#282c34','#eceef1','#181b20'],Rot:['#b82e3d','#fcecef','#821c2a'],Violett:['#7544b5','#f2ebfb','#512b86']};
function applyTheme(name){const t=themes[name]||themes.Blau;['--accent','--soft','--ink'].forEach((k,i)=>document.documentElement.style.setProperty(k,t[i]));}function setTheme(name){db.theme=name;applyTheme(name);save()}
const paths={Heute:'M3 10 12 3l9 7M5 9v12h14V9M9 21v-8h6v8',Kontakte:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M18 8a3 3 0 0 1 0 6M22 21v-3a4 4 0 0 0-3-4',Geschäftschancen:'M3 7h18v14H3zM8 7V3h8v4M3 12h18M10 12v3h4v-3',Weltkarte:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18',Einstellungen:'M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6'};
const oldRender=render;render=function(){oldRender();applyTheme(db.theme||'Blau');$('#bottomnav').innerHTML=Object.keys(paths).map(p=>`<button aria-label="${p}" class="${page===p?'active':''}" onclick="go('${p}')"><svg class="navicon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[p]}"/></svg>${p==='Geschäftschancen'?'Chancen':p==='Einstellungen'?'Mehr':p==='Weltkarte'?'Netzwerk':p}</button>`).join('');if(page==='Heute'){const title=$('#view h1');title.textContent='Dein Tag. Alles im Blick.';const sub=title.nextElementSibling;if(sub)sub.textContent='Kontakte pflegen. Chancen nutzen.';const panels=document.querySelectorAll('#view .grid > div > .card');if(panels[3])panels[3].remove();}if(page==='Einstellungen')$('#view').insertAdjacentHTML('afterbegin',`<section class="card"><h2>Deine Akzentfarbe</h2><p class="muted">Mach Networkee zu deinem Arbeitsplatz.</p><div class="swatches">${Object.keys(themes).map(n=>`<button aria-pressed="${(db.theme||'Blau')===n}" onclick="setTheme('${n}')"><span class="swatch" style="background:${themes[n][0]}"></span>${n}</button>`).join('')}</div><div class="actions"><button onclick="go('Aufgaben')">Alle Aufgaben ansehen</button></div></section>`);if(page==='Weltkarte')worldView();};
const oldContactForm=contactForm;contactForm=function(id){oldContactForm(id);const c=person(id)||{};$('#cf .actions').insertAdjacentHTML('beforebegin',`<label>Standort / Ort</label><input name="location" value="${esc(c.location||'')}" placeholder="z. B. Zürich, Schweiz"><div class="actions"><button type="button" onclick="pickLocation()">Standort auf Karte markieren</button><button type="button" onclick="$('#cf [name=lat]').value='';$('#cf [name=lng]').value=''">Markierung entfernen</button></div><details><summary>Koordinaten manuell eingeben</summary><label>Breitengrad (−90 bis 90)</label><input name="lat" type="number" min="-90" max="90" step="any" value="${esc(c.lat??'')}"><label>Längengrad (−180 bis 180)</label><input name="lng" type="number" min="-180" max="180" step="any" value="${esc(c.lng??'')}"></details><div id="picker"></div>`);const submit=$('#cf').onsubmit;$('#cf').onsubmit=e=>{let a=$('#cf [name=lat]').value,b=$('#cf [name=lng]').value;if((a==='')!==(b==='')){e.preventDefault();return toast('Bitte beide Koordinaten angeben oder beide leeren.')}submit(e)}};
const oldDetail=detail;detail=function(id){oldDetail(id);let c=person(id);$('#modal h1').insertAdjacentHTML('afterend',`<div class="locationbadge">${esc(c.location||'Noch kein Standort hinterlegt')}</div>`)};
let mapAllowed=sessionStorage.getItem('networkee-map')==='yes',mapPromise,worldMap,pickerMap;function leaflet(){if(window.L)return Promise.resolve();if(mapPromise)return mapPromise;mapPromise=new Promise((resolve,reject)=>{let css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.append(css);let js=document.createElement('script');js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';js.onload=resolve;js.onerror=()=>{mapPromise=null;reject(Error('Kartenbibliothek nicht erreichbar'))};document.head.append(js)});return mapPromise}function consent(){return `<p>Die Karte lädt Inhalte von OpenStreetMap und unpkg. Dabei werden deine IP-Adresse und der angezeigte Kartenausschnitt an externe Anbieter übertragen. Kontaktnamen und Notizen werden nicht übermittelt.</p>`}function tiles(map){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map)}function located(c){return c.lat!==''&&c.lng!==''&&c.lat!=null&&c.lng!=null&&Number.isFinite(Number(c.lat))&&Number.isFinite(Number(c.lng))&&Math.abs(Number(c.lat))<=90&&Math.abs(Number(c.lng))<=180}
function worldView(){worldMap?.remove();worldMap=null;const all=db.contacts.filter(located);$('#view').innerHTML=`<div class="top"><div><div class="eyebrow">DEIN NETZWERK AUF DER WELT</div><h1>Beziehungen kennen keine Grenzen.</h1><p class="muted">${all.length} von ${db.contacts.length} Kontakten auf der Karte.</p></div><button onclick="contactForm()">＋ Kontakt</button></div>${mapAllowed?`<section class="card maplayout"><div><div class="actions" style="margin-bottom:12px"><button onclick="worldMap?.setView([20,0],2)">Welt</button><button onclick="worldMap?.setView([46.8,8.2],7)">Schweiz</button><button onclick="fitContacts()">Mein Netzwerk</button></div><div id="worldmap"></div><div id="mapstatus" class="sub"></div></div><div class="maplist"><h2>Deine Standorte</h2>${db.contacts.map(c=>`<div class="row"><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.location||'Ort fehlt')}${located(c)?'':' · nicht markiert'}</div><button onclick="${located(c)?`worldMap?.setView([${Number(c.lat)},${Number(c.lng)}],10);detail('${c.id}')`:`contactForm('${c.id}')`}">${located(c)?'Kontakt öffnen':'Standort ergänzen'}</button></div></div>`).join('')}</div></section>`:`<section class="card"><h2>Wo ist dein Netzwerk zuhause?</h2>${consent()}<button class="primary" onclick="mapAllowed=true;sessionStorage.setItem('networkee-map','yes');render()">Karte für diese Sitzung aktivieren</button></section>`}`;if(mapAllowed)loadWorld()}
async function loadWorld(){try{await leaflet();if(page!=='Weltkarte'||!$('#worldmap'))return;worldMap=L.map('worldmap').setView([20,0],2);tiles(worldMap);db.contacts.filter(located).forEach(c=>{const b=document.createElement('button');b.textContent=c.name+' · '+(c.location||'Standort');b.onclick=()=>detail(c.id);L.marker([+c.lat,+c.lng],{icon:L.divIcon({className:'mapmarker',html:esc(initials(c.name)),iconSize:[34,34]})}).addTo(worldMap).bindPopup(b)});$('#mapstatus').textContent='Zoomen und verschieben, um dein Netzwerk zu erkunden. Überlappende Marker durch Zoomen trennen.'}catch{$('#mapstatus').textContent='Karte konnte nicht geladen werden. Deine Kontakte bleiben über die Liste erreichbar.'}}
function fitContacts(){let a=db.contacts.filter(located);if(!a.length)return toast('Hinterlege zuerst einen Standort bei einem Kontakt.');worldMap?.fitBounds(a.map(c=>[+c.lat,+c.lng]),{padding:[35,35],maxZoom:10})}
async function pickLocation(){if(!mapAllowed){$('#picker').innerHTML=consent()+`<button type="button" onclick="mapAllowed=true;sessionStorage.setItem('networkee-map','yes');pickLocation()">Karte aktivieren</button>`;return}$('#picker').innerHTML='<p class="sub">Zoome zum gewünschten Ort und klicke auf die Karte. Der Punkt wird beim Speichern des Kontakts übernommen.</p><div id="pickmap"></div>';try{await leaflet();if(!$('#pickmap'))return;const a=$('#cf [name=lat]'),b=$('#cf [name=lng]');pickerMap=L.map('pickmap').setView(a.value!==''&&b.value!==''?[+a.value,+b.value]:[46.8,8.2],a.value!==''?8:3);tiles(pickerMap);let m;if(a.value!==''&&b.value!=='')m=L.marker([+a.value,+b.value]).addTo(pickerMap);pickerMap.on('click',e=>{a.value=e.latlng.lat.toFixed(5);b.value=(((e.latlng.lng+180)%360+360)%360-180).toFixed(5);if(m)m.setLatLng([+a.value,+b.value]);else m=L.marker([+a.value,+b.value]).addTo(pickerMap);toast('Standort gewählt. Kontakt speichern, um ihn zu übernehmen.')})}catch{$('#picker').innerHTML='<p>Karte nicht erreichbar. Koordinaten können manuell eingetragen werden.</p>'}}
const oldCapture=capture;capture=function(id){oldCapture(id);if(!$('#record'))return;$('#modal h1').insertAdjacentHTML('beforebegin',`<div class="mascot" id="mascot"><img src="networkee-icon.png" alt="Networkee Glühlampen-Assistent"><span class="lid left"></span><span class="lid right"></span></div>`)};const oldRecord=recordAudio;recordAudio=async function(){await oldRecord();$('#mascot')?.classList.toggle('listening',recorder?.state==='recording');if(recorder)recorder.addEventListener('stop',()=>$('#mascot')?.classList.remove('listening'),{once:true})};
render();
</script></body></html>
